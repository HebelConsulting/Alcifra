# Auto-generated user manual (ADR 0502). Keeps manual/manual.typ's screenshots in step with the real app and gates
# on the manual building.
#
#  - On a pull request: regenerate the DESKTOP screenshots (the Avalonia client's headless --screenshot hooks — no
#    Docker/Chrome, cheap) and `typst compile` the manual against them + the committed web screenshots. A renamed/
#    removed screen breaks the capture or a figure reference, failing the job — so a PR can't merge without updating
#    the manual. This is the anti-staleness gate.
#  - On push to main: additionally regenerate the WEB screenshots (the harness stands up the app via Testcontainers
#    and drives system Chrome, like the heavy CI tier), recompile, and commit the refreshed PDF + screenshots back to
#    main. The committed PDF (a published path) then rides the normal private -> public sync (ADR 0484).
#
# Runs ONLY on the private canonical repo (like the auto-publish workflow) — the Typst sources live under the
# published manual/ dir, but the regenerate-and-commit step is a canonical-repo action; public receives the PDF via
# the sync. The bot commit uses GITHUB_TOKEN, which by design does not trigger further workflow runs (no loop).
name: User manual

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: manual-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the push-to-main job commits the regenerated manual

jobs:
  gate:
    # A white-label edition builds its own manual too (ADR 0996), and uploads it rather than committing it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publishes: ${{ steps.role.outputs.publishes }}
      white_label: ${{ steps.role.outputs.white_label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: role
        run: scripts/brand-release-role.sh

  manual:
    # 13-15 min on main with one language (measured 2026-10-30); the German pass captures every screen again
    # (ADR 1011), so about twice that, with room for a slow runner.
    timeout-minutes: 45
    name: Build the user manual
    needs: gate
    if: ${{ vars.REPO_ROLE == 'private' || (needs.gate.outputs.white_label == 'true' && needs.gate.outputs.publishes == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Pinned and cached, from the release tarball (see the action for why not setup-typst).
      - name: Set up Typst
        uses: ./.github/actions/setup-typst

      # The desktop client renders headless via Avalonia + Skia; on a Linux runner that needs fontconfig + fonts
      # (the app embeds Inter via WithInterFont, but fall back to DejaVu/Noto for any other glyphs).
      # Bounded and retried, because this step HUNG twice on 2026-08-18 (manual runs #659 and #661) while
      # sibling runs minutes either side passed it — the signature of a stalled package mirror rather than a
      # broken command. Two things follow:
      #
      #   timeout-minutes  — without it the job inherits GitHub's SIX HOUR default, so an apt stall burns a
      #                      runner all day and the PR simply never reports. A fast failure is strictly better
      #                      than a silent one.
      #   the retry loop   — a mirror stall is transient, so one retry usually turns a lost run into a slow one.
      #
      # THE BOUND IS PER ATTEMPT, and that is the whole point (#635). It was on the STEP, so all three attempts
      # shared one five-minute budget: a stall on attempt 1 consumed it and attempts 2 and 3 never ran — the
      # loop could not retry the one failure it exists for. It failed exactly that way twice on 2026-08-19,
      # and the tell was in the log: NEITHER failing run contained the loop's own ::warning:: line, so no
      # iteration ever completed. A retry whose budget is shared with the thing it is retrying is decoration.
      #
      # `timeout` runs INSIDE sudo, so it parents apt-get directly — outside it, the signal goes to sudo and
      # only reaches apt if sudo forwards it. `--kill-after` because ignoring SIGTERM is one of the ways apt
      # hangs; SIGKILL follows ten seconds later. The step timeout stays as a BACKSTOP, sized above
      # the loop's worst case (3 x 180s + backoff) so it only ever fires if the loop itself is wedged.
      #
      # DEBIAN_FRONTEND/NEEDRESTART_MODE remove the other way this can wait forever: a debconf or needrestart
      # prompt on a runner where nothing can answer it.
      - name: Install fonts for headless desktop rendering
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo -E timeout --kill-after=10 90 apt-get update -qq \
              && sudo -E timeout --kill-after=10 90 apt-get install -y -qq --no-install-recommends \
                   libfontconfig1 fonts-dejavu-core fonts-noto-core; then
              exit 0
            else
              # Captured in the ELSE, not after the `fi`: past the end of an if-statement `$?` is the status of
              # the STATEMENT (0 when the condition merely failed), so reading it there would label every
              # failure identically and the distinction below would be silently inert.
              rc=$?
            fi
            # 124 is timeout's own exit code, so a stalled mirror is named as one rather than reported as a
            # generic failure — the two want different responses, and only one of them is worth retrying.
            case $rc in
              124|137) reason="timed out" ;;
              *)       reason="failed" ;;
            esac
            echo "::warning::font install attempt $attempt $reason — retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the rendering fonts after 3 attempts"
          exit 1

      # Builds the harness and — via its project references — the API + desktop client, so the capture subprocesses
      # can run with --no-build.
      - name: Build the capture harness
        run: dotnet build tests/Alcifra.ManualCapture/Alcifra.ManualCapture.csproj -c Debug

      # Cheap, self-contained (in-process demo data — no backend). The gate on every PR.
      - name: Capture desktop screens
        # And again in German, into screenshots/de, for the German manual's figures (ADR 1011).
        run: |
          dotnet run --project tests/Alcifra.ManualCapture --no-build -- --desktop
          dotnet run --project tests/Alcifra.ManualCapture --no-build -- --desktop --lang de

      # Heavy (Testcontainers + Chrome) — main only, so PRs stay cheap. The hosted Ubuntu image ships Docker +
      # Google Chrome, which the self-host fleet + Playwright ("chrome" channel) use (same as the heavy CI tier).
      - name: Capture web screens
        if: ${{ github.event_name == 'push' }}
        run: |
          dotnet run --project tests/Alcifra.ManualCapture --no-build -- --web
          dotnet run --project tests/Alcifra.ManualCapture --no-build -- --web --lang de

      # The desktop screens classified Capture.Live, against the same real seeded app (#1358) — so the PUBLISHED
      # desktop figures stop coming from a hand-written fixture that cannot fail when the product moves. Needs
      # Docker and no Chrome, and Docker is already up for the step above: incremental cost, not new cost.
      #
      # AFTER the fixture pass deliberately. The fixture step above writes every desktop PNG including the live
      # ones, so this must overwrite them rather than be overwritten — the published figure is the live one.
      - name: Capture desktop screens from the live app
        if: ${{ github.event_name == 'push' }}
        run: |
          dotnet run --project tests/Alcifra.ManualCapture --no-build -- --desktop-live
          dotnet run --project tests/Alcifra.ManualCapture --no-build -- --desktop-live --lang de

      # A regenerated PNG whose every pixel is within ±1 of the committed one is raster noise, not a change
      # (#832) — revert those BEFORE the compile, so neither the PNG nor the PDF that embeds it re-commits
      # over nothing. A real UI change moves pixels by far more and still commits.
      - name: Drop raster-noise screenshot regenerations
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 scripts/keep-unchanged-screenshots.py manual/screenshots
          python3 scripts/keep-unchanged-screenshots.py manual/screenshots/de

      # Fails if a screen was renamed/removed so a figure has no PNG — the anti-staleness lock.
      # SOURCE_DATE_EPOCH pins the PDF's internal timestamps + the datetime.today() year to the fixed
      # capture clock (ADR 0510) so a rebuild with no content change is byte-identical — no spurious commits.
      # The product's name is ONE value, the brand file's (ADR 0989), read as generate-manual.sh reads it.
      - name: Compile the manual
        run: |
          set -euo pipefail
          source scripts/brand.sh
          # Named from the brand's file stem (ADR 0997). The one compile (#2022, ADR 1016): main's manual says
          # "generated <date>"; only the release image's build names a version.
          pdf="src/Alcifra.Api/wwwroot/download/manual/$BRAND_FILE_STEM-Manual.pdf"
          scripts/compile-manual.sh "$pdf"
          echo "MANUAL_PDF=$pdf" >> "$GITHUB_ENV"
          # The German manual (ADR 1011), committed beside the English one.
          echo "MANUAL_PDF_DE=${pdf%.pdf}-de.pdf" >> "$GITHUB_ENV"

      # The site bundle (ADR 1010, #2004): the figures and feature summaries the website reads, out of this manual.
      # Built and checked on every run, so a change that breaks the contract fails its PR here. Main's bundle is the
      # preview's input, and the release attaches it (scripts/release-site-bundle.sh).
      - name: Build the site bundle
        run: |
          set -euo pipefail
          source scripts/brand.sh
          python3 -I scripts/site-bundle.py build --out "$RUNNER_TEMP/site-bundle" --product-id core \
            --product-name "$BRAND_NAME" --lang en --typ manual/manual.typ --pdf "$MANUAL_PDF" --commit "$GITHUB_SHA"
          python3 -I scripts/site-bundle.py build --out "$RUNNER_TEMP/site-bundle" --product-id core \
            --product-name "$BRAND_NAME" --lang de --typ manual/manual.de.typ --pdf "$MANUAL_PDF_DE" --commit "$GITHUB_SHA"
          python3 -I scripts/site-bundle.py validate "$RUNNER_TEMP/site-bundle.zip"

      - name: Upload the site bundle
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-bundle
          path: ${{ runner.temp }}/site-bundle.zip
          if-no-files-found: error

      # main only: commit the regenerated PDF + screenshots. GITHUB_TOKEN pushes do not trigger workflows, so no
      # loop; [skip ci] is belt-and-suspenders. A no-op when nothing changed.
      # A white-label edition keeps its diff to upstream brand/ only (ADR 0996): its manual is uploaded, never
      # committed, and its image build takes it from here.
      - name: Upload the white-label edition's manual
        if: ${{ needs.gate.outputs.white_label == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual
          path: ${{ env.MANUAL_PDF }}
          if-no-files-found: error

      - name: Commit the regenerated manual
        if: ${{ github.event_name == 'push' && needs.gate.outputs.white_label != 'true' }}
        run: |
          git config user.name "simplarchive-manual-bot"
          git config user.email "manual-bot@users.noreply.github.com"
          git add -A manual/screenshots src/Alcifra.Api/wwwroot/download/manual
          if git diff --cached --quiet; then
            echo "Manual unchanged — nothing to commit."
          else
            git commit -m "docs(manual): regenerate the user manual from the current app [skip ci]"
            git push origin HEAD:main
          fi

  # The site bundle WHERE THE MANUAL IS NOT BUILT (ADR 1010): the public repository receives the manual's PDF and
  # screenshots through the mirror but runs no capture, and both readers of the bundle look there: the release
  # attaches it (scripts/release-site-bundle.sh, desktop-packages.yml) and the website's build fetches it. So it is
  # built here from the committed files: Typst only, no app, no browser.
  site-bundle:
    timeout-minutes: 10
    needs: gate
    if: ${{ vars.REPO_ROLE != 'private' && needs.gate.outputs.white_label != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned and cached, from the release tarball (see the action for why not setup-typst).
      - name: Set up Typst
        uses: ./.github/actions/setup-typst

      - name: Build the site bundle from the committed manual
        run: |
          set -euo pipefail
          source scripts/brand.sh
          python3 -I scripts/site-bundle.py build --out "$RUNNER_TEMP/site-bundle" --product-id core \
            --product-name "$BRAND_NAME" --lang en --typ manual/manual.typ \
            --pdf "src/Alcifra.Api/wwwroot/download/manual/$BRAND_FILE_STEM-Manual.pdf" --commit "$GITHUB_SHA"
          python3 -I scripts/site-bundle.py build --out "$RUNNER_TEMP/site-bundle" --product-id core \
            --product-name "$BRAND_NAME" --lang de --typ manual/manual.de.typ \
            --pdf "src/Alcifra.Api/wwwroot/download/manual/$BRAND_FILE_STEM-Manual-de.pdf" --commit "$GITHUB_SHA"
          python3 -I scripts/site-bundle.py validate "$RUNNER_TEMP/site-bundle.zip"

      - name: Upload the site bundle
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-bundle
          path: ${{ runner.temp }}/site-bundle.zip
          if-no-files-found: error
