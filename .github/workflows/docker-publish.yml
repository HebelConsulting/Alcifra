# Publishes the runtime Docker image to the brand's registry (ADR 0994) — from the brand's release repository only.
#
# The gate job asks the brand (ADR 0996): for Alcifra the release repository is the public mirror,
# HebelConsulting/SimplArchive, where GHCR and Actions minutes are free, and the job is a no-op on the private
# canonical. A white-label fork names its own repository and publishes from there. A repository gate is fine here: pushing an image to
# GHCR is harmless during the brief private-first window (the package just inherits the repo's visibility), unlike
# mutation testing / native CodeQL upload, which are additionally visibility-gated. Uses the built-in GITHUB_TOKEN
# (no registry secrets). Builds multi-arch (amd64 + arm64 via buildx + QEMU) and runs ONLY on a `v*` release tag —
# not on every main push (which would rebuild the slow arm64 layer each time) — matching desktop-packages.yml.
name: Docker image (GHCR)

on:
  push:
    tags: ["v*"]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Who publishes is the brand's to say (ADR 0996): its release repository, which for Alcifra is the public mirror.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publishes: ${{ steps.role.outputs.publishes }}
      white_label: ${{ steps.role.outputs.white_label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: role
        run: scripts/brand-release-role.sh

  publish:
    timeout-minutes: 60
    needs: gate
    if: ${{ needs.gate.outputs.publishes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read # a white-label edition takes its manual from the last manual build on main
      # KEYLESS SIGNING (#847, A08). cosign exchanges this job's OIDC token for a short-lived certificate
      # bound to the workflow's identity, so there is no signing key to hold, rotate or leak — the thing a
      # managed key exists to go wrong. It is a job-scoped grant and buys nothing else: an OIDC token names
      # this workflow and cannot write anything.
      id-token: write
    # Every custom image: the API, the OCR sidecar, and the MTA (ADR 0630). Kubernetes pulls them — it cannot
    # `build ./ocr` or `build ./postfix` the way Compose does, so an image the chart references must be
    # published here or the chart installs a Deployment that can never start.
    strategy:
      matrix:
        include:
          - { suffix: "", context: ., file: Dockerfile }
          - { suffix: "-ocr", context: ./ocr, file: ./ocr/Dockerfile }
          - { suffix: "-postfix", context: ./postfix, file: ./postfix/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image's registry and name are the brand's (ADR 0994): <imageRegistry>/<imageName><suffix>.
      - name: Image name from the brand
        id: brand
        run: |
          set -euo pipefail
          source scripts/brand.sh
          echo "image=$BRAND_IMAGE_REGISTRY/$BRAND_IMAGE_NAME${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          echo "registry=${BRAND_IMAGE_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "cache=$BRAND_IMAGE_NAME${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      # A white-label edition does not commit its manual (ADR 0996), so the repository still holds the upstream one.
      # Its image carries its own instead: the PDF the last successful manual build on main uploaded.
      - name: The edition's own manual
        if: ${{ needs.gate.outputs.white_label == 'true' && matrix.suffix == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/edition-manual.sh --white-label

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.brand.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.brand.outputs.image }}
          # :vX.Y.Z + :X.Y on a v* release tag, :<sha> for traceability, and :latest for the newest stable release
          # (metadata-action's default latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Multi-arch so the image runs on amd64 (Hetzner/most clouds) and arm64 (Oracle Ampere A1 free tier,
          # Hetzner CAX). The API image's only native dep is NetVips (ships linux-musl-arm64); PDFium/Docnet is
          # DesktopClient-only. The OCR sidecar is python:slim + apt/pip — all arm64-available.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          # Stamp the release version into the baked-in desktop-client download artifacts (ADR 0490). Ignored by
          # the ocr image's Dockerfile (no VERSION arg there).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.brand.outputs.cache }}
          cache-to: type=gha,mode=max,scope=${{ steps.brand.outputs.cache }}
          # ATTESTATIONS (#847, A08). Nothing attested what these images were built from: Trivy scans them,
          # which answers "are there known CVEs in it" and not "where did this come from and what is in it".
          # Those are the two questions a consumer of a published image has, and only the first had an answer.
          #
          # provenance mode=max records the build steps and their inputs, not merely that a build happened —
          # which is what makes it useful for "was this image built from the tag it claims". Safe at max HERE
          # because the only build-arg is VERSION; a secret passed as a build-arg would be recorded by it, so
          # check that before adding one.
          #
          # sbom emits SPDX for the image's contents, which is what turns "is this CVE in our estate" from an
          # archaeology exercise into a query.
          #
          # NO MANIFEST-SHAPE RISK, which is the usual reason people leave these off: attestations make the
          # pushed manifest an OCI image index, and this build is ALREADY multi-arch, so it has been one all
          # along. Nothing that can pull these images today stops being able to.
          provenance: mode=max
          sbom: true

      # The DIGEST, so the signature names the exact bytes rather than a tag that can be moved afterwards —
      # which is the whole difference between signing an artefact and signing a label.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the image keylessly
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Every tag metadata-action produced points at the same digest, so one signature covers them all.
          cosign sign --yes "${{ steps.brand.outputs.image }}@${DIGEST}"
