# Publishes the two .NET tools — alcifra (the administrative CLI, ADR 0822) and apass (the password-store CLI,
# ADR 0977) — to GitHub Packages AND nuget.org — PUBLIC repo only.
#
# ONE workflow for both, on purpose: the nuget.org trusted-publishing policy pins this FILE, so a second tool in a
# second workflow would need a second policy on nuget.org. Renaming this file means editing that policy too (it was
# saconsole-publish.yml until ADR 1018).
#
# Triggered on a v* tag and role-gated to the public mirror (`REPO_ROLE=public`, ADR 1018), like the Docker and
# desktop publishes: release tags are created DIRECTLY on the public repo (the mirror does not mirror tags), so the
# gate is what keeps this a no-op if a v* tag ever appears on the private canonical.
#
# THE VERSION COMES FROM THE TAG, not from a property. This repository has no single <Version>: releases are
# v* tags, and the Docker images derive their version the same way. That is the one structural difference from
# CAManagement's publish, whose packages share a <Version> in src/Directory.Build.props — do not copy that
# shape here looking for a file to bump; there isn't one, and inventing one would give the tool a version that
# disagrees with the release it shipped in.
#
# nuget.org uses TRUSTED PUBLISHING — no stored API key. NuGet/login exchanges this run's GitHub OIDC token for
# a short-lived nuget.org key, valid only because the nuget.org policy pins exactly this repository, this
# workflow FILE, and the `public` environment. Three things that will bite whoever touches this next:
#
#   * the login's `user:` names the policy CREATOR, not the package owner — nuget.org matches policies by
#     creator, and passing the owner is a bare 401;
#   * the job MUST declare `environment: public`, or the token's claims do not match the policy and the
#     exchange fails — and that environment has to exist in the PUBLIC repo, which is where this runs;
#   * renaming this file breaks the policy match SILENTLY. Update the policy on nuget.org in the same change.
#
# The package id was `SimplArchive.Cli` from 0.47.0 (ADR 0941) and is `Alcifra.Cli` since 0.55.0; `HebelConsulting.SimplArchive.Cli` stays on
# nuget.org deprecated in its favour, and nothing publishes it any more.
#
# This file must NOT join publish/publish-public.sh's withheld set: it is useless in the private repo and is
# the whole point in the mirror.
name: Publish alcifra and apass

on:
  push:
    tags: ["v*"]
  # A re-run for a tag whose publish failed after the release was already cut — the version is stated
  # explicitly rather than guessed, because a wrong one here publishes a package that lies about its release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.33.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # lets the runner mint the OIDC token trusted publishing exchanges

jobs:
  publish:
    timeout-minutes: 15
    if: ${{ vars.REPO_ROLE == 'public' }}
    runs-on: ubuntu-latest
    # Must match the environment pinned in the nuget.org trusted-publishing policy.
    environment: public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publishing alcifra $version"

      # Each tool is packed under its Alcifra id (Alcifra.Cli → `alcifra`, Alcifra.Pass → `apass`). The earlier ids
      # (SimplArchive.Cli → `saconsole`, SimplArchive.Sapass → `sapass`) were packed beside them until phase 5 of the
      # rename (#1117), which retired them as their trigger said (ADR 0885): they stay on nuget.org at 0.54.0,
      # deprecated in favour of the new ones, and an install moves with `dotnet tool uninstall` + `install`.
      - name: Pack
        run: |
          set -euo pipefail
          version=${{ steps.version.outputs.value }}
          for project in src/Alcifra.Cli/Alcifra.Cli.csproj src/Alcifra.Sapass/Alcifra.Sapass.csproj; do
            dotnet pack "$project" -c Release -o dist/nuget --nologo -p:Version="$version"
          done
          ls dist/nuget

      - name: Push to GitHub Packages
        run: |
          set -euo pipefail
          for glob in "dist/nuget/Alcifra.*.nupkg"; do
            dotnet nuget push "$glob" --source "https://nuget.pkg.github.com/HebelConsulting/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: monacense

      - name: Push to nuget.org
        run: |
          set -euo pipefail
          for glob in "dist/nuget/Alcifra.*.nupkg"; do
            dotnet nuget push "$glob" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done

      - name: Report
        run: |
          echo "::notice::alcifra and apass ${{ steps.version.outputs.value }} pushed to GitHub Packages and nuget.org."
          echo "::notice::Install with: dotnet tool install --global Alcifra.Cli (or Alcifra.Pass)"
