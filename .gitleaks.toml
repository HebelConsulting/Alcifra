# gitleaks configuration (ADR 0436 "gitleaks secret scan in CI").
#
# Extends gitleaks' default high-confidence ruleset and pre-allowlists this repo's KNOWN dev-only credentials,
# so a rules update never trips on them while a real leaked secret is still caught. Alcifra is deliberately
# "Not for production" (dev OpenIddict certs + plaintext dev credentials — see the CLAUDE.md "Path to
# enterprise-grade" section), so the compose stack / dev appsettings / seed scripts intentionally carry throwaway
# credentials. Today the default ruleset reports zero leaks across the full history; this allowlist is
# precautionary + documents the accepted dev values.

title = "Alcifra gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Known dev-only credentials — throwaway values, not real secrets."

# Files whose whole purpose is the local dev/demo stack's fixed credentials.
paths = [
  '''docker-compose\.yaml''',
  '''scripts/db-init\.sql''',
  '''scripts/seaweedfs-s3\.json''',
  '''src/Alcifra\.Api/appsettings\.Development\.json''',
  '''deploy/kiosk/.*''',
]

# Specific dev-only credential strings (belt-and-suspenders, in case one appears outside the files above — e.g.
# an ADR or CLAUDE.md quoting the compose stack). Keep this list surgical so a real secret elsewhere is NOT
# accidentally suppressed.
regexes = [
  '''dev-bootstrap-secret''',
  '''simplarchive_vault_bootstrap''',
  '''dev-root-token-id=root''',
  '''storageadmin''',
  '''SimplDemo2026!''',
  # The E2E/desktop tests' throwaway webhook signing secret (AuditWebhookTestDeliveryTests /
  # DesktopTenantSettingsTests) — it signs test deliveries to a loopback listener and nothing else.
  '''s3cr3t-signing-key''',
  # IntrayOcrLanguagesTests' throwaway user password (a Testcontainers-only login). The pre-#561 spelling
  # (inboxocr1234) never tripped the generic-api-key heuristics; the Intray rename's spelling does, and the
  # old value lives on in the branch history either way — so the fixture is allowlisted by value, surgically.
  '''intrayocr1234''',
  # The module-settings E2E fixture's login password (#1082). Same class as intrayocr1234 above: a
  # throwaway value seeded into a Testcontainers database that lives for one test run.
  '''modsettings1234''',
  # ModuleAdministrationByServiceAccountTests' throwaway manager password (ADR 0870). Same class again: replaced
  # by the class's shared fixture value, but the first spelling lives on in the branch history.
  '''modsa-mgr-1234''',
  # CertificateEnrolmentTests' throwaway holder password (#1970 slice 4). Same class again. The private scan never
  # saw it: it arrived through a merge commit, whose diff gitleaks does not read, while the public mirror's snapshot
  # commit carries it as an ordinary change and its full-history scan went red (public run #1267 onwards).
  '''twokeys12345''',
  # SaConsoleTests' PLACEHOLDER private key (#1353). `saconsole me certificate register` refuses a file
  # holding key material before it is sent, and the test proves that by handing it a PEM that begins
  # `-----BEGIN PRIVATE KEY-----` — which is precisely what the private-key rule looks for. The body is the
  # literal `MIIE...`, three dots, so it is not key material and never was.
  #
  # Allowlisted BY THE PLACEHOLDER BODY rather than by the header or the file: matching `MIIE\.\.\.` keeps
  # the private-key rule live everywhere, including in this same file, so a real key pasted here would still
  # be caught. Suppressing the header would have switched the rule off for the one test whose subject is
  # detecting that header.
  '''MIIE\.\.\.''',
]

# NOT A SECRET: a test helper's tuple signature, `(string Pem, RSA Key, X509Certificate2 Certificate)`, which the
# generic-api-key rule reads as a key assignment (its "secret" is the type name after `Key,`). It came into the core
# with the certificate tests moved from the Encryption Module (ADR 0936); the element is named Signer now, but the
# first spelling lives on in the branch history. Matched against the whole LINE and only for that rule, so the rule
# stays live for everything else, this file included.
[[allowlists]]
description = "A tuple signature in CertificateChainTests, not a credential"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''\(string Pem, RSA Key(, X509Certificate2 Certificate)?\)''']

# The verification-code tests (#183, ADR 1013) use the test key RFC 6238 itself publishes: "12345678901234567890"
# in Base32, GEZDGNBVGY3TQOJQ... (Appendix B). A public test vector, not a secret; allowed by that exact value only,
# for the generic-api-key rule that reads `secret=`/`Key =` beside it as a key assignment.
[[allowlists]]
description = "RFC 6238 Appendix B test key (Base32), used by the verification-code tests"
targetRules = ["generic-api-key"]
regexes = ['''GEZDGNBVGY3TQOJQ(GEZDGNBVGY3TQOJQ)*''']
